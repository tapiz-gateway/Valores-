name: "Tapiz Engine"

on:
  push:
    branches:
      - principal

  pull_request:
    branches:
      - principal

  schedule:
    - cron: "29 21 * * 5"

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: "tapiz-${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  tapiz:
    name: "Tapiz - Observacion"
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Observar repositorio
        uses: actions/checkout@v5
        with:
          fetch-depth: 1
          persist-credentials: false
